<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎨 Красивое Todo-приложение</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <h1>📝 Мои задачи</h1>
      <button id="themeToggle" class="theme-toggle">🌙 Темная тема</button>
      <div class="add-form">
        <input
          type="text"
          id="todoInput"
          placeholder="Введите новую задачу..."
        />
        <button id="addBtn">Добавить</button>
      </div>
      <div class="search">
        <input type="text" id="searchInput" placeholder="Поиск задач..." />
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="completed">Выполненные</button>
      </div>
      <ul id="todoList" class="todos">
        <!-- Задачи будут здесь -->
      </ul>
      <div id="emptyState" class="empty-state">Нет задач. Добавьте первую!</div>
      <div class="stats"><span id="remainingCount">0</span> задач осталось</div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
